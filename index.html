<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RemoteWorkHub – Real Online Jobs & Step-by-Step Application Guides</title>
    <meta name="description" content="Learn how to apply, get accepted, and start earning from real online platforms through simple beginner-friendly guides." />
    <meta name="keywords" content="remote jobs, online jobs, freelance platforms, work from home, beginner guides, Fiverr, Upwork, application tutorials" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="RemoteWorkHub – Real Online Jobs & Guides" />
    <meta property="og:description" content="Step-by-step guides to help you find, apply, and start earning from real online platforms." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Merriweather:wght@400;700&display=swap" rel="stylesheet" />
    
    <!-- 1. Include Netlify Identity Widget -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- 2. Handle Identity Invite/Recovery Redirects -->
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", (user) => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              // Redirect to CMS after user logs in via invite/recovery link
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
  </body>
</html>
